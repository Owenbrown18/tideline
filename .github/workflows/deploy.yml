name: Deploy

# On every push to main: build the arm64 image, push it to ECR, point both
# Lambda functions at it, and apply any new database migration. No AWS keys:
# the job assumes an IAM role through GitHub's OIDC token
# (infra/github_oidc.tf). scripts/deploy.sh does the same from the laptop.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a deploy half way

permissions:
  contents: read
  id-token: write # required to request the OIDC token

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: sitewatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push the arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64 # Graviton Lambda
          push: true
          provenance: false # Lambda takes a plain image, not an image index
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point both functions at the new image
        run: |
          image="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          for fn in tideline-run tideline-web tideline-demo; do
            aws lambda update-function-code --function-name "$fn" --image-uri "$image" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$fn"
            echo "$fn now runs $image"
          done

      - name: Apply any new migration
        run: |
          aws lambda invoke --function-name tideline-run --cli-binary-format raw-in-base64-out \
            --payload '{"task":"migrate"}' out.json --query FunctionError --output text | tee err.txt
          cat out.json
          ! grep -q Unhandled err.txt

      - name: Check the dashboard answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.DASHBOARD_URL }}healthz")
          echo "healthz: $code"
          test "$code" = 200
