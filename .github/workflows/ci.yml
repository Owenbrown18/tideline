name: CI

# Lint, type-check and test on every push and pull request, then prove the
# Lambda image builds for arm64 and its code and migrations load inside it.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The token can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (unit and integration)
        # The integration tests build a real SQLite database through the
        # migrations, so no database service is needed.
        run: uv run pytest -q

      - name: sites.example.yaml still loads
        run: |
          uv run tideline migrate
          uv run tideline seed sites.example.yaml
        env:
          TIDELINE_DATABASE_URL: sqlite+aiosqlite:///ci.db

      - name: The demo runs end to end
        run: scripts/demo.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3: the image is arm64 (Graviton Lambda)

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the Lambda image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          provenance: false
          tags: tideline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test inside the image
        run: |
          docker run --rm --platform linux/arm64 --entrypoint python tideline:ci -c \
            "import tideline.aws_lambda; from tideline.aws_lambda import _migrate; _migrate(); print('ok')"
