<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1826">
  <title>Sign in · Tideline</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon-none.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/tideline.css?v={{ assets }}">
</head>
<body class="signin-page">
<main class="signin">
  <p class="wordmark">Tideline<span class="p-up">.</span></p>
  <h1>Sign in</h1>
  {% if error %}<p class="signin-error" role="alert">That username and password didn't match.</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required value="{{ username }}" {% if not username %}autofocus{% endif %}>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required {% if username %}autofocus{% endif %}>
    <button class="btn btn-deep" type="submit">Sign in</button>
  </form>
  <p class="signin-foot">Tideline by OBdesign</p>
</main>
</body>
</html>
