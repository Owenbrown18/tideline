# Local demo (scripts/demo.sh): one fake site, served on the laptop.
sites:
  - name: Fake Bakery
    domain: fakesite.test
    expected_text: "Fake Bakery"
    urls:
      - http://127.0.0.1:8765/
    checks:
      tls: false         # plain HTTP on the laptop: no certificate to check
      domain: false      # "fakesite.test" is not a registered domain
      dns: false
      email_auth: false
      links: false
      form: false
